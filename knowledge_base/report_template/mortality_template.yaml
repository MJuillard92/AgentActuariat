  # ─────────────────────────────────────────────────────────────────────────
  # Section : Construction de la table de mortalité (taux bruts par âge)
  # Active en mode raw_rates ET full_report (pas description).
  # Cf. rapport référence AF8796-TD3 §3 "La construction de la table".
  # Consomme `qx_table` produit par `builder.crude_rates` (D_x, E_x, q_x
  # par âge entier sur la cohorte cohort_min_age..cohort_max_age).
  # ─────────────────────────────────────────────────────────────────────────
  - id: table_construction
    label: "Construction de la table — taux bruts par âge"
    required: true
    dependencies: [data_preprocessing]
    activation:
      report_mode: [full_report, raw_rates]

    narrative:
      text_default: |
        Les taux bruts de mortalité q_x par âge ont été estimés à partir
        des {{ total_exposure }} années-personne et {{ total_deaths }} décès
        observés sur la cohorte d'âges {{ cohort_min_age }} à {{ cohort_max_age }} ans.
        Pour chaque âge x, le taux brut est défini par q_x = D_x / E_x,
        où D_x désigne les décès observés et E_x l'exposition centrale.
        Ces taux bruts constituent l'étape intermédiaire avant lissage
        et calibration de la table d'expérience.

      text_raw_rates: |
        Les taux bruts de mortalité q_x par âge ont été estimés à partir
        des {{ total_exposure }} années-personne et {{ total_deaths }} décès
        observés sur la cohorte d'âges {{ cohort_min_age }} à {{ cohort_max_age }} ans.
        Pour chaque âge x, le taux brut est défini par q_x = D_x / E_x,
        où D_x désigne les décès observés et E_x l'exposition centrale.
        À la demande, AUCUN lissage n'est appliqué sur ces taux ; ils sont
        livrés en l'état pour analyse ou ré-utilisation externe.

    llm_directives:
      tone: "professionnel, actuariel, méthodologique"
      length_words: [120, 220]
      rag_query: "taux bruts mortalité q_x calcul actuariel exposition centrale"

      post_table_analysis:
        instruction: >
          À partir du tableau des taux bruts, commenter (1) la plage d'âges
          couverte ; (2) les âges où l'exposition est faible (E_x < 10) et
          où le taux brut est donc peu crédible ; (3) la forme générale
          (croissance avec l'âge, oscillations dues à la faible volumétrie).
          Ne PAS interpréter de tendance fine — les taux bruts sont par
          nature très volatils.
        length_words: [80, 150]
        few_shot_example: |
          - les taux bruts sont calculés sur la plage 30-85 ans, couvrant
            l'essentiel de l'exposition ;
          - aux âges extrêmes (< 35 et > 80), la faiblesse de l'exposition
            (E_x < 10) rend les taux peu crédibles ;
          - la forme générale est croissante avec l'âge, avec une volatilité
            marquée du fait de la taille modeste du portefeuille (1546 a.-p.).

    visual_specs:
      - id: crude_rates_deciles_table
        type: table
        purpose: >
          Synthèse des taux bruts agrégés par déciles d'exposition
          (10 buckets contigus représentant ~10% chacun). Reproduit la
          structure du Tableau 7 du rapport référence.
        source: qx_deciles_table
        columns:
          - {key: age_range,     label: "Classe d'âges"}
          - {key: E_x_sum,       label: "Exp",                     format: int}
          - {key: proportion,    label: "% Exp",                   format: float1}
          - {key: D_x_observed,  label: "Décès\nobservés",         format: int}
          - {key: D_x_predicted, label: "Décès prédits\n(D_pred = Σ E_x × q_x brut)", format: int}
          - {key: ecart_pct,     label: "Écart %\n|D_obs − D_pred| / D_pred",         format: float1}
          - {key: ci_lower,      label: "IC Min\n95%",             format: int}
          - {key: ci_upper,      label: "IC Max\n95%",             format: int}

      - id: crude_rates_chart
        type: chart
        chart_type: scatter
        purpose: "Taux bruts q_x par âge — visualisation des variations."
        source: qx_table
        x_axis: {key: age, label: "Âge"}
        y_axis: {key: qx,  label: "Taux brut q_x"}

  # ─────────────────────────────────────────────────────────────────────────
  # Section : Lissage des taux bruts (full_report uniquement)
  # En raw_rates, smoothed_table est juste assimilé à qx_table par une
  # branche déterministe du Builder ; la section n'est pas activée.
  # ─────────────────────────────────────────────────────────────────────────
  - id: smoothing
    label: "Lissage des taux bruts"
    required: false
    dependencies: [table_construction]
    activation:
      report_mode: [full_report]

    narrative:
      text: |
        Les taux bruts q_x calculés à partir des {{ total_exposure }}
        années-personne et {{ total_deaths }} décès ont été lissés pour
        produire la table de mortalité d'expérience finale, sur la plage
        d'âges {{ cohort_min_age }} à {{ cohort_max_age }} ans.

        ### Méthodologie de lissage

        La méthode retenue est **Whittaker-Henderson**, qui minimise un
        compromis entre fidélité aux observations et régularité de la
        courbe :

        > min  Σ E_x × (q_brut − q_lisse)²  +  λ × Σ (Δ² q_lisse)²

        où Δ² est la différence finie d'ordre 2 (mesure la courbure
        locale) et λ le paramètre de pénalisation. Plus λ est élevé,
        plus la courbe est régulière au prix d'un écart accru aux
        observations. Le paramètre est mis à l'échelle automatiquement
        en fonction de l'exposition moyenne ; sa valeur effective est
        rapportée dans la section *Validation statistique* qui suit.

        Le tableau ci-dessous présente, pour chaque décile d'exposition,
        les décès observés comparés aux décès prédits **par les taux
        lissés** (D_pred = Σ E_x × q_x_lisse). C'est l'évaluation
        agrégée de la capacité du lissage à reproduire les observations.
        Le détail âge par âge des taux bruts et lissés est reporté en
        annexe.

    llm_directives:
      tone: "professionnel, actuariel, méthodologique"
      length_words: [180, 300]
      rag_query: "lissage taux bruts mortalité Whittaker-Henderson Makeham"

      post_table_analysis:
        instruction: >
          À partir de smoothed_deciles_table, commenter (1) la régularité
          de l'écart D_observés vs D_prédits par décile ; (2) l'ampleur
          maximale de l'écart relatif et le décile concerné ; (3) la
          présence éventuelle d'un biais systématique haut ou bas. NE PAS
          conclure sur l'adéquation statistique — c'est l'objet exclusif
          de la section *Validation statistique* qui suit (tests χ²,
          signes, runs, KS, Durbin-Watson).
        length_words: [100, 180]
        few_shot_example: |
          - sur les déciles centraux (40-70 ans), l'écart relatif reste
            inférieur à 2 %, signe d'une fidélité satisfaisante ;
          - l'écart maximal est observé sur le dernier décile (âges
            avancés), où le lissage attire la queue vers la moyenne ;
          - aucun biais systématique apparent — les écarts sont
            répartis des deux côtés du zéro.

    visual_specs:
      - id: smoothed_deciles_table
        type: table
        purpose: >
          Décès observés vs prédits par déciles d'exposition, avec les
          taux LISSÉS (D_pred = Σ E_x × q_x_lisse). Évalue la capacité
          du lissage à reproduire les observations agrégées.
        source: smoothed_deciles_table
        columns:
          - {key: age_range,     label: "Classe d'âges"}
          - {key: E_x_sum,       label: "Exp",                                       format: int}
          - {key: proportion,    label: "% Exp",                                     format: float1}
          - {key: D_x_observed,  label: "Décès\nobservés",                           format: int}
          - {key: D_x_predicted, label: "Décès prédits\n(D_pred = Σ E_x × q_x lissé)", format: int}
          - {key: ecart_pct,     label: "Écart %\n|D_obs − D_pred| / D_pred",         format: float1}
          - {key: ci_lower,      label: "IC Min\n95%",                               format: int}
          - {key: ci_upper,      label: "IC Max\n95%",                               format: int}

      - id: obs_vs_smoothed_chart
        type: chart
        chart_type: multi_series
        purpose: >
          Comparaison taux bruts (points) et taux lissés (ligne) avec
          intervalle de confiance à 95% (aire). Reproduit la Figure 8
          du rapport référence.
        x_axis: {key: age, label: "Âge"}
        y_axis: {key: q_x, label: "Taux de mortalité q_x"}
        series:
          - {source: qx_table,       key_x: age, key_y: qx,        style: point, label: "Taux brut",  color: "#1A3668"}
          - {source: smoothed_table, key_x: age, key_y: q_x_lisse, style: line,  label: "Taux lissé", color: "#E25B34"}
          - {source: ci_table,       key_x: age, key_y_lower: ci_lower, key_y_upper: ci_upper, style: area, label: "IC 95%", color: "#E25B34", alpha: 0.18}

  # ─────────────────────────────────────────────────────────────────────────
  # Section : Validation statistique du lissage (full_report uniquement)
  # Produite par builder.statistical_validation (auto-déclenchée).
  # ─────────────────────────────────────────────────────────────────────────
  - id: validation
    label: "Validation statistique de la table lissée"
    required: false
    dependencies: [smoothing]
    activation:
      report_mode: [full_report]

    narrative:
      text: |
        Cette section soumet la table lissée à une batterie de tests
        statistiques d'adéquation.

        ### Calcul des intervalles de confiance à 95 %

        Les intervalles de confiance sur les décès prédits sont
        construits sous **hypothèse poissonienne** : pour chaque âge x
        (ou pour chaque décile d'exposition), D_x suit approximativement
        une loi de Poisson de paramètre λ_x = E_x × q_x. L'IC 95 % est
        alors

        > IC_95 % = [ D_pred − 1.96 × √D_pred ;  D_pred + 1.96 × √D_pred ]

        Ramené sur le taux : IC sur q = IC sur D divisé par E_x. Un
        taux observé hors de cet intervalle signale un écart
        statistiquement significatif entre observation et modèle.

        ### Batterie de tests appliquée

        Cinq tests indépendants évaluent l'adéquation sous différents
        angles :

        - **χ² d'adéquation** — Σ (O_i − E_i)² / E_i suit χ² à n−1
          degrés de liberté sous H₀ « le lissage reproduit les
          observations ». Évalue la fidélité globale.
        - **Test des signes** — nombre d'âges où q_lisse > q_brut.
          Sous H₀ « lissage non biaisé », suit Binomial(n, 0.5). Détecte
          un décalage systématique haut ou bas.
        - **Wald-Wolfowitz (runs)** — nombre de séquences de signes
          identiques dans (q_lisse − q_brut). Trop peu de runs → lissage
          trop rigide ; trop de runs → suit le bruit aléatoire.
        - **Kolmogorov-Smirnov sur les résidus** — teste si les résidus
          standardisés (O − E)/√E suivent N(0,1). Détecte un défaut de
          spécification du modèle de bruit.
        - **Durbin-Watson** — statistique d'autocorrélation des résidus
          ordonnés par âge. Acceptation dans [1.5 ; 2.5].

        Le tableau ci-dessous présente les résultats et leur lecture.
        Une métrique de **régularité** (somme des carrés des
        différences finies d'ordre 2 du lissage) complète l'évaluation
        — elle quantifie l'arbitrage fidélité ↔ régularité.

    llm_directives:
      tone: "professionnel, actuariel, méthodologique"
      length_words: [180, 320]
      rag_query: "validation lissage tests adéquation chi carré Kolmogorov Durbin-Watson"

      post_table_analysis:
        instruction: >
          Pour chaque test du tableau validation_tests_table : rappeler
          son objet en une phrase, citer sa statistique et sa p-value,
          puis donner la lecture (champ interpretation). Citer
          smoothness_metrics.sum_squared_d2 et la commenter
          (régularité élevée ↔ faible valeur ; comparer à l'ordre de
          grandeur des q_x_lisse au carré). Conclure en citant
          validation_summary.global_assessment (acceptable /
          questionable / inadéquat) en explicitant le nombre de tests
          acceptés / rejetés.
        length_words: [120, 220]

    visual_specs:
      - id: validation_tests_table
        type: table
        purpose: "Résultats des tests statistiques d'adéquation du lissage."
        source: validation_tests_table
        columns:
          - {key: test,           label: "Test"}
          - {key: statistic,      label: "Statistique",  format: float4}
          - {key: p_value,        label: "p-value",      format: float4}
          - {key: df,             label: "df",           format: int}
          - {key: decision,       label: "Décision"}
          - {key: interpretation, label: "Lecture"}

  # ─────────────────────────────────────────────────────────────────────────
  # Section : Lissage par sexe — tables H et F
  # Activée uniquement si gender_segmentation = by_sex.
  # Produite par builder.smoothing(by_sex=True), branche déterministe Builder.
  # ─────────────────────────────────────────────────────────────────────────
  - id: smoothing_by_sex
    label: "Lissage par sexe — tables H et F"
    required: false
    dependencies: [smoothing]
    activation:
      report_mode: [full_report]
      gender_segmentation: [by_sex]

    narrative:
      text: |
        Les taux de mortalité ont été calculés puis lissés séparément
        pour les hommes et les femmes, conformément à la dissymétrie
        de sinistralité identifiée dans l'analyse descriptive du
        portefeuille. Cette ventilation est une exigence quasi-systématique
        des rapports de certification (Solvabilité II, normes IFRS 17),
        la mortalité féminine étant typiquement 30 à 50 % inférieure
        à la mortalité masculine au même âge.

    llm_directives:
      tone: "professionnel, actuariel, comparatif"
      length_words: [150, 250]
      rag_query: "mortalité par sexe table H F différenciation actuariel"

      post_table_analysis:
        instruction: >
          Comparer les courbes lissées H et F : (1) écart relatif moyen
          au-dessus de 40 ans ; (2) âges où l'écart est le plus marqué ;
          (3) éventuelle convergence aux grands âges. Citer
          total_exposure_h / total_exposure_f et total_deaths_h /
          total_deaths_f pour contextualiser les volumes.
        length_words: [100, 180]

    visual_specs:
      - id: smoothed_chart_by_sex
        type: chart
        chart_type: multi_series
        purpose: "Comparaison des taux lissés Hommes vs Femmes."
        x_axis: {key: age, label: "Âge"}
        y_axis: {key: q_x, label: "Taux de mortalité q_x"}
        series:
          - {source: smoothed_table_h, key_x: age, key_y: q_x_lisse, style: line, label: "Hommes",  color: "#1A3668"}
          - {source: smoothed_table_f, key_x: age, key_y: q_x_lisse, style: line, label: "Femmes",  color: "#E25B34"}

  # ─────────────────────────────────────────────────────────────────────────
  # Section : Benchmarking — comparaison aux tables réglementaires
  # Produite par builder.benchmarking (auto-déclenchée — full_report).
  # ─────────────────────────────────────────────────────────────────────────
  - id: benchmarking
    label: "Benchmarking — comparaison aux tables réglementaires"
    required: false
    dependencies: [validation]
    activation:
      report_mode: [full_report]

    narrative:
      text: |
        Pour situer la table d'expérience par rapport à la mortalité de
        la population française de référence, elle a été comparée à la
        table réglementaire {{ reference_name }}. Le SMR (Standardized
        Mortality Ratio) — défini par SMR = Σ D_x_obs / Σ D_x_attendus
        où D_x_attendus = E_x × q_x_ref — quantifie globalement
        l'écart de mortalité du portefeuille à la référence.

        Le facteur d'abattement local α_x = q_x_lisse / q_x_ref mesure
        ce même écart âge par âge ; il révèle les plages d'âges où le
        portefeuille s'écarte le plus de la référence.

    llm_directives:
      tone: "professionnel, actuariel, méthodologique"
      length_words: [180, 300]
      rag_query: "SMR benchmarking table référence TH TF abattement mortalité"

      post_table_analysis:
        instruction: >
          Citer le SMR global ({{ smr_global }}) et son interprétation :
          < 0,5 = forte sélection médicale ; 0,5–0,8 = sélection modérée
          (typique prévoyance entreprise) ; 0,8–1,2 = proche référence ;
          > 1,2 = surmortalité (alerter). Commenter l'âge à abattement
          minimum et l'âge à abattement maximum (lus dans le summary).
          Conclure sur la cohérence du portefeuille avec la référence.
        length_words: [100, 180]

    visual_specs:
      - id: abatement_table
        type: table
        purpose: "Facteurs d'abattement âge par âge contre la table de référence."
        source: abatement_table
        columns:
          - {key: age,              label: "Âge",                 format: int}
          - {key: qx_exp,           label: "q_x expérience",      format: pct2_dec}
          - {key: qx_ref,           label: "q_x référence",       format: pct2_dec}
          - {key: abatement_factor, label: "α = q_exp / q_réf",   format: float4}

  # ─────────────────────────────────────────────────────────────────────────
  # Section : Conclusion — synthèse globale du rapport
  # ─────────────────────────────────────────────────────────────────────────
  - id: conclusion
    label: "Conclusion"
    required: false
    dependencies: [benchmarking]
    activation:
      report_mode: [full_report]

    narrative:
      text: |
        Cette table de mortalité d'expérience repose sur
        {{ total_exposure }} années-personne et {{ total_deaths }} décès
        observés sur la plage d'âges effective {{ cohort_min_age }} à
        {{ cohort_max_age }} ans. Le lissage Whittaker-Henderson a
        produit une table dont l'adéquation aux observations est jugée
        « {{ validation_summary.global_assessment }} » par la batterie
        de tests statistiques. Le SMR global vis-à-vis de la référence
        {{ reference_name }} s'établit à {{ smr_global }}.

    llm_directives:
      tone: "professionnel, actuariel, conclusif"
      length_words: [220, 380]
      rag_query: "conclusion rapport mortalité certification synthèse"

      post_table_analysis:
        instruction: >
          Rédiger une conclusion structurée en trois paragraphes :
          (1) Qualité du lissage — citer validation_summary
          (n_tests_accepted, n_tests_rejected, global_assessment),
          smoothness_metrics.sum_squared_d2, et l'éventuelle violation
          de monotonie.
          (2) Positionnement vis-à-vis de la référence — citer
          smr_global, l'âge à abattement minimum et maximum.
          (3) Limites et points de vigilance — année partielle si
          détectée, plage d'âges effective vs demandée, écart H/F si
          gender_segmentation = by_sex, taux d'exclusion au
          retraitement.
          Pas de table dans cette section — uniquement du texte
          narratif synthétique.
        length_words: [220, 380]

    visual_specs: []

  # ─────────────────────────────────────────────────────────────────────────
  # Annexe : table complète âge par âge (bruts + lissés).
  # Bypass narrative LLM (_ANNEX_SECTION_IDS dans _04_redaction.py).
  # ─────────────────────────────────────────────────────────────────────────
  - id: annex
    label: "Annexe — Table de mortalité (taux bruts et lissés par âge)"
    required: false
    dependencies: [conclusion]
    activation:
      report_mode: [full_report]

    narrative:
